[em_StartCmd]
button=%documents%\Settings\TotalCommander\icons\cmd.ico
cmd=%comspec% /k
menu=Start Cmd
param=cd /d "%P"
[em_StartCmd-Admin]
button=%documents%\Settings\TotalCommander\icons\cmd.ico
cmd=*%comspec% /k
menu=Start Cmd as Admin
param=cd /d "%P"
[em_StartEverything]
cmd=C:\Windows\System32\schtasks.exe /run /I /TN EverythingSkipUAC
button=%documents%\Settings\TotalCommander\Icons\Everything.ico
menu=Start Everything Search
iconic=1
[em_StartCmder]
button=%documents%\Settings\TotalCommander\icons\cmder.ico
cmd=d:\bin\Cmder\Cmder.exe /C %documents%\Settings\Cmder
menu=Start Cmder
[em_StartCmder-Admin]
button=%documents%\Settings\TotalCommander\icons\cmder.ico
cmd=*d:\bin\Cmder\Cmder.exe /C %documents%\Settings\Cmder
menu=Start Cmder as Admin
[em_StartMinTTY]
button=%documents%\Settings\TotalCommander\Icons\mintty.ico
cmd=D:\bin\cygwin\bin\mintty.exe
menu=Start MinTTY
param=/bin/env CHERE_INVOKING=1 /bin/bash -l
[em_StartMinTTY-Admin]
button=%documents%\Settings\TotalCommander\Icons\mintty.ico
cmd=*D:\bin\cygwin\bin\mintty.exe
menu=Start MinTTY as Admin
param=/bin/env CHERE_INVOKING=1 /bin/bash -l
[em_StartPowershell]
button=%documents%\Settings\TotalCommander\icons\powershell.ico
cmd=%SystemRoot%\system32\WindowsPowerShell\v1.0\powershell.exe
menu=Start Powershell
param=-NoExit -NoLogo
[em_StartPowershell-Admin]
button=%documents%\Settings\TotalCommander\icons\powershell.ico
cmd=*%SystemRoot%\system32\WindowsPowerShell\v1.0\powershell.exe
menu=Start Powershell as Admin
param=-NoExit -NoLogo cd '%P'
[em_StartAdvancedRun]
button=%documents%\Settings\TotalCommander\Icons\advancedrun.ico
cmd=D:\bin\NirsoftLauncher\NirSoft\x64\advancedrun.exe
menu=Start AdvancedRun
[em_StartTotalCommander-Admin]
button=%documents%\Settings\TotalCommander\Icons\totalcmd.ico
cmd=*%COMMANDER_EXE%
param=/N /L=%P /R=%T
menu=Start Total Commander as Admin
